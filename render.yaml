# Render blueprint for the EduMaster Pro API. The web application is hosted
# on Netlify (netlify.toml), which forwards /api to this service.
#
# In Render: New → Blueprint → pick this repository. Values marked
# `sync: false` are asked for when the blueprint is first applied; enter
# them there, never in this file. See docs/deployment.md.
services:
  - type: web
    name: edumaster-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    # Ohio sits next to Neon's us-east-2; keep the API close to its database.
    region: ohio
    # The free plan sleeps after 15 minutes idle (the first request then takes
    # about a minute). Use `starter` or above for a school in daily use.
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      # Render routes traffic to $PORT.
      - key: PORT
        value: '4000'
      - key: API_PORT
        value: '4000'
      # Netlify's proxy, then Render's load balancer.
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: COOKIE_SECURE
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: RATE_LIMIT_NAMESPACE
        value: edumaster
      # The Netlify address people open, e.g. https://schoolerp.netlify.app
      - key: CORS_ORIGINS
        sync: false
      # Neon: the direct (not "-pooler") connection string.
      - key: DATABASE_URL
        sync: false
      # rediss://… from your Redis provider.
      - key: REDIS_URL
        sync: false
      # Cloudflare R2: https://<account id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
