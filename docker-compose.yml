# Local development infrastructure. Credentials come from `.env` (see
# `.env.example`); there are deliberately no fallback passwords here.
# Ports are published on 127.0.0.1 only so nothing is reachable from the LAN.
name: edumaster

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required — run `npm run setup`}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run `npm run setup`}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required — run `npm run setup`}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — run `npm run setup`}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for photos, documents and logos, provided
  # locally by Versity Gateway (an open-source S3 gateway over a plain
  # directory). In production, point S3_ENDPOINT at any S3-compatible service.
  storage:
    image: versity/versitygw:latest
    restart: unless-stopped
    command: ['--port', ':7070', 'posix', '/data']
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required — run `npm run setup`}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — run `npm run setup`}
    ports:
      - '127.0.0.1:${S3_PORT:-9100}:7070'
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:
